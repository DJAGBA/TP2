AWSTemplateFormatVersion: '2012-10-17'
Description: 'TP AWS Lambda - Code charge depuis src/main.py'

Parameters:
  Environment:
    Type: String
    Description: 'Environnement name (e.g. votre identifiant sans le learnaws)'
    Default: 'asonhouin'
  BucketName:
    Type: String
    Description: 'S3 bucket name (e.g. votre identifiant sans le learnaws + -bucket pour différencier du bucket de votre voisin)'
    Default: 's3-bucket-trigger-lambda'

Resources:
  # Fonction Lambda
  LambdaTigger:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Environment}-lambda-trigger'
      Handler: main.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: python3.12
      Code: ../src

  # S3 bucket pour stocker les fichier 
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !sub '${Environment}-${BucketName}'
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: 's3:ObjectCreated:*'
            Function: !GetAtt LambdaFunction.Arn